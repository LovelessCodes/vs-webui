[package]
name = "vs-webui-manager"
version = "0.1.0"
edition = "2021"
description = "Manager daemon for the vs-webui Vintage Story server image"
license = "MIT"

[[bin]]
name = "vs-webui-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
flate2 = "1"
futures-util = "0.3"
libc = "0.2"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
